<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration → Profile Cards</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Student Registration</h1>
    <p>Fill in the form to create your profile card.</p>
  </header>

  <main class="container">
    <!-- Registration Form -->
    <section class="form-section">
      <form id="registrationForm" novalidate>
        <fieldset>
          <legend>Personal Information</legend>

          <label for="firstName">First Name</label>
          <input type="text" id="firstName" required>
          <small class="error" id="firstNameError"></small>

          <label for="lastName">Last Name</label>
          <input type="text" id="lastName" required>
          <small class="error" id="lastNameError"></small>

          <label for="email">Email</label>
          <input type="email" id="email" required>
          <small class="error" id="emailError"></small>

          <label for="programme">Programme</label>
          <input type="text" id="programme" required>
          <small class="error" id="programmeError"></small>

          <label for="year">Year</label>
          <select id="year" required>
            <option value="">--Select Year--</option>
            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option>4</option>
          </select>
          <small class="error" id="yearError"></small>

          <label for="interests">Interests</label>
          <textarea id="interests" rows="3"></textarea>

          <label for="photo">Photo URL</label>
          <input type="url" id="photo" placeholder="http://example.com/photo.jpg">
        </fieldset>

        <button type="submit">Register</button>
      </form>

      <div id="feedback" aria-live="assertive"></div>
    </section>

    <!-- Profile Cards -->
    <section class="cards-section">
      <h2>Profile Cards</h2>
      <div id="cardsContainer" class="cards-container"></div>
    </section>
  </main>

  <!-- Summary Table -->
  <section class="table-section">
    <h2>Summary Table</h2>
    <input type="text" id="search" placeholder="Search profiles...">
    <table id="summaryTable">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Programme</th>
          <th>Year</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <script src="script.js"></script>
</body>
</html>
